abstract: |-
  A human newborn is a living organism with homeostatic regulation, affect, sensorimotor coupling, social-orienting biases, and a powerful capacity for statistical learning. It is not yet a language-bearing, norm-bearing, autobiographically extended self. By the age of three to five a recognizable someone has formed, and by adulthood the same initial architecture can support a scientist, a citizen, a parent, a legal subject, a reflective philosophical agent. This paper proposes a bootstrapping architecture that accounts for that divergence. It takes as its starting point the interactionist consensus already established by neuroconstructivism and developmental systems theory, that development is neither maturation alone nor inscription on a blank slate but emerges from organism-environment coupling, and its contribution is not that premise but a specific staging of it. The thesis is that adult cognitive personhood is co-compiled: biologically prepared proto-agential systems enter caregiver-mediated loops of affect regulation, joint attention, language, norm enforcement, autobiographical narration, executive scaffolding, and cultural-tool use, and the child progressively internalizes the regulatory and symbolic structures first run around it by others. The argument is an integrative synthesis with a defined scope. It stages a determinate proto-agent-to-person stack and integrates developmental psychology, attachment theory, predictive processing, language-acquisition research, Vygotskian internalization, Tomasellian shared intentionality, autobiographical-memory theory, executive-function development, and cultural evolution, carrying the bootstrapping process past childhood into the institutional layers that most developmental syntheses leave unaddressed, and it tests the integrated account against the boundary cases of institutional deprivation and late first-language acquisition. The result is a layered control architecture in which each acquired layer rewrites the learning conditions for the next. The paper is candid that an integration of this breadth is hard to falsify as a whole and that much of what it accommodates it accommodates by construction, and it isolates the mediation and ordering claims on which the architecture could actually be tested. The account is developmental and cognitive, and is held strictly separate from claims about moral or legal status: the newborn lacks adult-style cognitive personhood and retains full moral standing. The developmental layering mirrors, under compression, the layered history of the person concept itself, which classical anthropology has long treated as a category assembled across the history of societies rather than given whole.
